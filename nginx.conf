server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    access_log off;
    autoindex off;
    client_max_body_size 1k;

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    error_page 404 /404.html;

    location = /              { return 301 /privacypolicy; }
    location = /privacypolicy { try_files /privacypolicy.html =404; }
    location = /terms         { try_files /terms.html =404; }
    location = /imprint       { try_files /imprint.html =404; }
    location = /404.html      { internal; }

    location / { return 404; }
}
